# VNC password file configuration
#
# This file sets system-wide defaults for the vncpasswd(1) utility and the
# pam_vncpasswd(8) PAM module.
#
# Supported key:
#   passwd_file = <path>
#       Path to the per-user VNC password file.
#       A leading "~/" is expanded to the authenticating user's home directory.
#       Defaults to ~/.vnc/passwd when this file does not specify a value.
#
# Example:
#   passwd_file = ~/.vnc/passwd
#
# Note: per-user overrides can be placed in ~/.config/vnc/vncpasswd.conf
# and take precedence over this file.
